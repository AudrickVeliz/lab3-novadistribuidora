# Actualizaciones semanales agrupadas; cada una llega como PR y pasa por Verificar (D-006).
# Docker se agrega cuando exista la imagen (paso 5 de la hoja de ruta).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      desarrollo:
        dependency-type: development
      produccion:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      acciones:
        patterns: ["*"]
